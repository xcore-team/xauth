      - Invitations: api/invites.md
      - Audit: api/audit.md
  - Sécurité:
      - Tokens JWT & Blacklist: security/tokens.md
      - Rate Limiting: security/rate-limiting.md
      - Audit Log: security/audit.md
  - IPC Inter-plugins: ipc.md
  - Guide d'intégration xcore: ../integration.md
